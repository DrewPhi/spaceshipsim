[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "space-sim-crew"
version = "0.1.0"
description = "An original cooperative, AI-directed starship simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
space-sim-crew = "space_sim_crew.main:run"

[tool.hatch.build.targets.wheel]
packages = ["server/space_sim_crew"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
